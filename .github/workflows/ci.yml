name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-15, python: "3.13" }
          - { os: macos-15-intel, python: "3.13" }
          - { os: ubuntu-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - name: Qt font path (Windows offscreen)
        if: runner.os == 'Windows'
        run: echo "QT_QPA_FONTDIR=C:\Windows\Fonts" >> $env:GITHUB_ENV
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -ra

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: windows-x64 }
          - { os: macos-15, asset: macos-arm64 }
          - { os: macos-15-intel, asset: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: PyInstaller
        shell: bash
        env: { PYTHONPATH: src }
        run: python -m PyInstaller --noconfirm --clean packaging/calcbridge.spec
      - name: Smoke test the packaged app (libusb + Qt load)
        shell: bash
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            QT_QPA_FONTDIR='C:\Windows\Fonts' dist/CalcBridge/CalcBridge.exe --self-test
            dist/CalcBridge/calcbridge-cli.exe --sim ls /
          else
            find dist/CalcBridge.app -name 'libusb*'
            dist/CalcBridge.app/Contents/MacOS/CalcBridge --self-test
          fi
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/CalcBridge -DestinationPath CalcBridge-${{ matrix.asset }}.zip
      - name: DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dmg && ditto dist/CalcBridge.app dmg/CalcBridge.app && ln -s /Applications dmg/Applications
          for i in 1 2 3 4 5; do
            hdiutil create -volname CalcBridge -srcfolder dmg -fs HFS+ -format UDZO -ov CalcBridge-${{ matrix.asset }}.dmg && break
            echo "hdiutil retry $i"; sleep 15
          done
          test -f CalcBridge-${{ matrix.asset }}.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: CalcBridge-${{ matrix.asset }}
          path: |
            *.zip
            *.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
