name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev
      - name: Front end (type check and bundle)
        working-directory: app
        run: |
          npm ci
          npm run build
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: windows-x64, target: x86_64-pc-windows-msvc }
          - { os: macos-15, asset: macos-arm64, target: aarch64-apple-darwin }
          - { os: macos-15-intel, asset: macos-x86_64, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, asset: linux-x86_64, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev
      - name: Build the app and its installers
        working-directory: app
        run: |
          npm ci
          npx tauri build --target ${{ matrix.target }}
      - name: Build the command line
        run: cargo build --release --locked -p calcbridge-cli --target ${{ matrix.target }}
      - name: Self-test the packaged binaries
        shell: bash
        env:
          CALCBRIDGE_SELFTEST_OUT: selftest.txt
        run: |
          dir=target/${{ matrix.target }}/release
          ls "$dir"
          app="$dir/calcbridge-app"; [ -f "$app.exe" ] && app="$app.exe"
          [ -f "$dir/CalcBridge.exe" ] && app="$dir/CalcBridge.exe"
          "$app" --self-test || { cat selftest.txt; exit 1; }
          cat selftest.txt
          cli="$dir/calcbridge"; [ -f "$cli.exe" ] && cli="$cli.exe"
          "$cli" --sim ls -r /
      - name: Collect the downloads
        shell: bash
        run: |
          mkdir out
          dir=target/${{ matrix.target }}/release
          b=$dir/bundle
          case "$RUNNER_OS" in
            Windows)
              cp $b/nsis/*.exe "out/CalcBridge-${{ matrix.asset }}-setup.exe"
              cp $b/msi/*.msi "out/CalcBridge-${{ matrix.asset }}.msi"
              7z a "out/calcbridge-cli-${{ matrix.asset }}.zip" "./$dir/calcbridge.exe" ./LICENSE ;;
            macOS)
              cp $b/dmg/*.dmg "out/CalcBridge-${{ matrix.asset }}.dmg"
              tar -czf "out/calcbridge-cli-${{ matrix.asset }}.tar.gz" -C "$dir" calcbridge ;;
            Linux)
              cp $b/appimage/*.AppImage "out/CalcBridge-${{ matrix.asset }}.AppImage"
              cp $b/deb/*.deb "out/CalcBridge-${{ matrix.asset }}.deb"
              tar -czf "out/calcbridge-cli-${{ matrix.asset }}.tar.gz" -C "$dir" calcbridge ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: CalcBridge-${{ matrix.asset }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
