[package]
name = "calcbridge-cli"
description = "CalcBridge command line: files, screenshots, keys and documents for the TI-Nspire CX II"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "calcbridge"
path = "src/main.rs"

[dependencies]
calcbridge-link = { path = "../link", features = ["usb", "image"] }
calcbridge-tns = { path = "../tns" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
