[package]
name = "calcbridge-link"
description = "USB link to the TI-Nspire CX II: NNSE + NavNet, file/screen/key/OS services, and a simulator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["usb"]
usb = ["dep:nusb", "dep:futures-core"]
# Screenshot::save / Screenshot::png
image = ["dep:image"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
nusb = { version = "0.2.9", optional = true }
futures-core = { version = "0.3", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg", "bmp"] }

[dev-dependencies]
tempfile = "3"
